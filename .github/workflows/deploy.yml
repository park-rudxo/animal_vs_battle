name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # 사용자 리전에 맞게 수정 필요 (예: ap-northeast-2)

      - name: Deploy Frontend to S3
        run: |
          aws s3 cp index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html --acl public-read

      - name: Deploy Backend to Lambda
        run: |
          cd lambda
          zip -r function.zip index.mjs
          aws lambda update-function-code --function-name AnimalBattleBackend --zip-file fileb://function.zip
